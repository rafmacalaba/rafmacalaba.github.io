name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The companion assistant. Its bundle is the SDK's, not this repository's, so it is built from the
      # portable-slm source and packed into public/ before Astro runs: Astro copies public/ into dist/,
      # which is what gets deployed. Nothing generated is committed.
      # Pinned to a tag, not a branch: a change to the SDK's main must never be able to break a deploy
      # here, and a deploy must be reproducible from what this file names. Bump the tag deliberately.
      - uses: actions/checkout@v4
        with:
          repository: rafmacalaba/portable-slm
          ref: v0.3.6-site
          path: .slm
      - run: npm ci
        working-directory: .slm
      - run: npm run build:embed
        working-directory: .slm
      - run: npm run slm:pack
        env:
          SLM_SRC: .slm

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
